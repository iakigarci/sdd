name: AGENTS.md size

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Generated projects run this inside `just check`; the template repo has no
  # justfile, so it runs the script directly.
  agents-md:
    if: vars.IS_TEMPLATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-agents-md.sh 150
