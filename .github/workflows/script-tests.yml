name: Script tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Fixture tests for the reviewer Bash guard and the code-review
  # independence check. Generated projects keep both files and this job.
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .claude/hooks/review-bash-guard_test.sh
      - run: .agents/skills/code-review/scripts/check-independence_test.sh
