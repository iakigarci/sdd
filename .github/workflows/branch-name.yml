name: Branch name

on:
  pull_request:

permissions:
  contents: read

jobs:
  # The branch name ties the PR to its issue: <type>/<issue>-<slug>.
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          BRANCH: ${{ github.head_ref }}
        run: scripts/check-branch-name.sh "$BRANCH"

