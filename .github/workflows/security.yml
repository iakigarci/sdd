name: Security

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: new CVEs appear without code changes
  workflow_dispatch:

permissions:
  contents: read

# The template repo sets the IS_TEMPLATE variable: it has no code to scan and a
# CodeQL language placeholder, so these jobs run only in generated projects.
jobs:
  # New dependencies in the PR: known vulnerabilities and licences.
  # Needs the dependency graph: free on public repos, GitHub Code Security on private ones.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.IS_TEMPLATE != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure

  # Semantic SAST. Free on public repos, GitHub Code Security on private ones.
  codeql:
    if: vars.IS_TEMPLATE != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: "{{CODEQL_LANGUAGE}}"
          queries: security-extended
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # Re-run vulnerability and secret scans on main every week.
  scheduled-scan:
    if: github.event_name != 'pull_request' && vars.IS_TEMPLATE != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: just vuln secrets
