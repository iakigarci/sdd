name: PR shape

on:
  pull_request:

permissions:
  contents: read

jobs:
  # The branch name ties the PR to its issue: <type>/<issue>-<slug>.
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          BRANCH: ${{ github.head_ref }}
        run: scripts/check-branch-name.sh "$BRANCH"

  # Warns, never fails, past ~400 changed lines excluding generated files.
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the base commit
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-pr-size.sh "$BASE_SHA"
